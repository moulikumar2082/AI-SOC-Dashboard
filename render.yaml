services:
  - type: web
    name: ai-soc-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: USE_HTTPS
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
