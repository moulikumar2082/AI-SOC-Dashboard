{% extends "base.html" %}
{% block title %}Register - SOC Dashboard{% endblock %}

{% block extra_css %}
<style>
    body {
        background-color: #f4f6f9 !important;
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px) !important;
        background-size: 24px 24px !important;
        color: #1e293b !important;
    }

    .register-card {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 16px !important;
        box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08), 0 5px 15px rgba(0, 0, 0, 0.04) !important;
    }

    .register-card h3 {
        color: #0f172a !important;
        font-family: 'Inter', sans-serif !important;
    }

    .register-card label {
        color: #475569 !important;
    }

    .register-card .form-control, .register-card .form-select {
        background-color: #f8fafc !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
        font-family: 'Inter', sans-serif !important;
        border-radius: 8px !important;
    }

    .register-card .form-control:focus, .register-card .form-select:focus {
        background-color: #ffffff !important;
        border-color: #2563eb !important;
        box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15) !important;
    }

    .btn-register-light {
        background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
        color: #ffffff !important;
        font-family: 'Inter', sans-serif !important;
        font-weight: 600 !important;
        border: none !important;
        border-radius: 8px !important;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35) !important;
        transition: all 0.25s ease !important;
    }

    .btn-register-light:hover {
        background: linear-gradient(135deg, #1d4ed8, #1e40af) !important;
        color: #ffffff !important;
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5) !important;
        transform: translateY(-1px) !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-80 my-5">
    <div class="col-md-6 col-lg-5">
        <div class="register-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-block p-3 rounded-circle bg-blue-50 mb-3" style="background: rgba(37, 99, 235, 0.08);">
                    <i class="fas fa-user-plus text-primary display-5"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Register Analyst Account</h3>
                <p class="text-secondary small">Create credentials for security operations dashboard</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="analyst@organization.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Assigned Role</label>
                    <select name="role" class="form-select">
                        <option value="analyst" selected>Security Analyst</option>
                        <option value="user">Standard User</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="btn btn-register-light w-100 py-2.5 mb-3">
                    <i class="fas fa-user-check me-2"></i> Create Analyst Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top border-light">
                <p class="text-secondary small mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
