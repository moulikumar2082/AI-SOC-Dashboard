{% extends "base.html" %}
{% block title %}Register - SOC Dashboard{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-80 my-5">
    <div class="col-md-6 col-lg-5">
        <div class="soc-card p-4">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus text-cyan display-4 mb-2"></i>
                <h3 class="fw-bold text-light">Register Analyst Account</h3>
                <p class="text-muted small">Create credentials for security operations dashboard</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="analyst@organization.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Assigned Role</label>
                    <select name="role" class="form-select bg-dark text-light border-secondary">
                        <option value="analyst" selected>Security Analyst</option>
                        <option value="user">Standard User</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-semibold">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="btn btn-cyber-primary w-100 py-2 mb-3">
                    <i class="fas fa-user-check me-2"></i> Create Analyst Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top border-secondary">
                <p class="text-muted small mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-cyan text-decoration-none">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
